<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Route Planner</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="map"></div>
    <div id="control-panel">
        <h2>Route Planner</h2>
        <p>1. Select the starting point</p>
        <p>2. Select the destination point</p>
        <button id="reset-btn">Reset</button>
    </div>
    <div id="route-info">
        <strong>Distance:</strong> <span id="distance">-</span> km | 
        <strong>Duration:</strong> <span id="duration">-</span> min
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    <script src="graph-data.json"></script>
    <script src="dijkstra.js"></script>
    <script src="script.js"></script>
</body>
</html>
